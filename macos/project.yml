name: IdealVideoEncoder
options:
  bundleIdPrefix: io.github.alexmcdermott.idealvideoencoder
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "$(ARCHS_STANDARD)"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
targets:
  IVECore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/IVECore
    settings:
      base:
        PRODUCT_NAME: IVECore
  ive-cli:
    type: tool
    platform: macOS
    sources:
      - path: Sources/ive-cli
    dependencies:
      - target: IVECore
  IdealVideoEncoder:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: install-prerequisites.sh
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - target: IVECore
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: Ideal Video Encoder
        CFBundleDisplayName: Ideal Video Encoder
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Ideal Video Encoder. Free software under the GNU GPL v3 or later."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video clip
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.quicktime-movie, public.mpeg-4]
          - CFBundleTypeName: Folder of clips
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
    settings:
      base:
        PRODUCT_NAME: Ideal Video Encoder
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alexmcdermott.idealvideoencoder
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  IVECoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IVECoreTests
    dependencies:
      - target: IVECore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  IdealVideoEncoder:
    build:
      targets:
        IdealVideoEncoder: all
    run:
      config: Debug
  IVECore:
    build:
      targets:
        IVECore: all
        ive-cli: all
    test:
      targets:
        - IVECoreTests
