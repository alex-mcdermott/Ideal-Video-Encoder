name: IdealVideoEncoder
options:
  bundleIdPrefix: io.github.alexmcdermott.idealvideoencoder
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "$(ARCHS_STANDARD)"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
targets:
  IVECore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/IVECore
    settings:
      base:
        PRODUCT_NAME: IVECore
  ive-cli:
    type: tool
    platform: macOS
    sources:
      - path: Sources/ive-cli
    dependencies:
      - target: IVECore
  IVECoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IVECoreTests
    dependencies:
      - target: IVECore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  IVECore:
    build:
      targets:
        IVECore: all
        ive-cli: all
    test:
      targets:
        - IVECoreTests
